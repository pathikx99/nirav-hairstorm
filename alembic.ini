# Alembic configuration for Nirav Hairstorm
# This file is read by alembic.

[alembic]
# Path to migration scripts.
script_location = database/migrations

# Template used to generate migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Truncate long revision identifiers to 12 chars.
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate.
revision_environment = false

# Set to 'true' to allow .hierarchical_revision_key to be used with
# environment's 'heads' directive.
prepend_sys_path = .

# Timezone for file_template timestamp rendering.
timezone = UTC

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .hierarchical_revision_key to be used with
# environment's 'heads' directive; requires 2-digit year format
# prepend_sys_path = .

# Version locations (defaults to %(script_location)s/versions; do not specify %(here)s as paths with spaces will be split)
# version_locations = %(here)s/database/migrations/versions

# the output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# Database URL — overridden at runtime by env.py from app settings.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/hairstorm

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
