services:
  db:
    image: postgres:16-alpine
    container_name: hairstorm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hairstorm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hairstorm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hairstorm-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-hairstorm}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost"]
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        - NEXT_PUBLIC_AVATAR_RENDERER=${NEXT_PUBLIC_AVATAR_RENDERER:-auto}
        - NEXT_PUBLIC_ENABLE_P4_WEBGL=${NEXT_PUBLIC_ENABLE_P4_WEBGL:-true}
        - NEXT_PUBLIC_AVATAR_CDN_URL=${NEXT_PUBLIC_AVATAR_CDN_URL:-}
    container_name: hairstorm-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_AVATAR_RENDERER=${NEXT_PUBLIC_AVATAR_RENDERER:-auto}
      - NEXT_PUBLIC_ENABLE_P4_WEBGL=${NEXT_PUBLIC_ENABLE_P4_WEBGL:-true}
      - NEXT_PUBLIC_AVATAR_CDN_URL=${NEXT_PUBLIC_AVATAR_CDN_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
